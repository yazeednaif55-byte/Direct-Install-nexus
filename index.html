<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تثبيت Nexus Messenger</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 360px;
            width: 100%;
            border: 1px solid #334155;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #007aff, #00d2ff);
            border-radius: 18px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .instruction-box {
            background: #0f172a;
            border: 1px dashed #38bdf8;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #38bdf8;
        }

        .install-btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .install-btn:active {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="app-icon">💬</div>
        <h1>Nexus Messenger</h1>
        <p>تثبيت التطبيق على الآيفون</p>

        <div class="instruction-box">
            📌 اضغط الزر بالأسفل ثم اختار <br><b>"إضافة إلى الشاشة الرئيسية"</b>
        </div>

        <button class="install-btn" onclick="openShare()">
            تثبيت التطبيق الآن 📲
        </button>
    </div>

    <script>
        function openShare() {
            if (navigator.share) {
                navigator.share({
                    title: 'Nexus Messenger',
                    text: 'قم بإضافة Nexus Messenger إلى شاشتك الرئيسية',
                    url: window.location.href
                }).catch(() => {});
            } else {
                alert("اضغط على زر المشاركة أسفل الشاشة في سفاري ثم اختار (إضافة إلى الشاشة الرئيسية)");
            }
        }
    </script>

</body>
</html>
